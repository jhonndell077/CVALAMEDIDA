name: Deploy CVALAMEDIDA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: cvalamedida-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, cvalamedida]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    env:
      NODE_PATH: C:/Users/USER/Desktop/Mi_Informacion/cv-tailor-app/tests/node_modules
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use existing Python and Node tools on this PC
        run: |
          python -m venv --system-site-packages venv
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo preparar Python.' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE/venv/Scripts"
      - name: Restore private runtime configuration
        env:
          CV_BOOTSTRAP_DATA: ${{ secrets.CV_BOOTSTRAP_DATA }}
        run: python scripts/restore_ci_data.py
      - name: Verify the complete release with isolated runtime data
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo preparar la herramienta de cobertura.' }
          python scripts/verify_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Falló la verificación integral; no se publicará.' }
      - name: Remove synthetic test photo
        run: Remove-Item -LiteralPath 'data/hoja_de_vida.jpeg'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/100244961799/locations/global/workloadIdentityPools/cvalamedida-github/providers/github
          service_account: github-deploy@cv-a-la-medida-jhonn.iam.gserviceaccount.com
      - name: Deploy every function and both Hosting sites
        run: |
          $env:XDG_CONFIG_HOME = Join-Path $env:RUNNER_TEMP 'firebase-ci-config'
          firebase deploy --only functions,hosting --project cv-a-la-medida-jhonn --non-interactive
          if ($LASTEXITCODE -ne 0) { throw 'Firebase no completó el deploy.' }
      - name: Remove private runtime data from the runner checkout
        if: always()
        run: |
          foreach ($name in @('master_profile.json','bank_config.json','archive_config.json','hoja_de_vida.jpeg')) {
            $target = Join-Path (Join-Path $env:GITHUB_WORKSPACE 'data') $name
            if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target }
          }
