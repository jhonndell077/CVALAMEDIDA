name: Deploy CVALAMEDIDA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: cvalamedida-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Prepare Python and local tests
        run: |
          python -m venv venv
          echo "$GITHUB_WORKSPACE/venv/bin" >> "$GITHUB_PATH"
          venv/bin/python -m pip install -r requirements.txt
          npm ci --prefix tests
      - name: Restore private runtime configuration
        env:
          CV_BOOTSTRAP_DATA: ${{ secrets.CV_BOOTSTRAP_DATA }}
        run: |
          python scripts/restore_ci_data.py
      - name: Verify frontend and backend with local fixtures
        run: |
          npm test --prefix tests
          python -m unittest discover -s tests -p 'test_employment*.py'
          python -m unittest discover -s tests -p test_new_information.py
          python -m unittest discover -s tests -p test_profile_deletions.py
          python -m unittest discover -s tests -p test_separate_experiences.py
      - name: Remove synthetic test photo
        run: rm -f data/hoja_de_vida.jpeg
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/100244961799/locations/global/workloadIdentityPools/cvalamedida-github/providers/github
          service_account: github-deploy@cv-a-la-medida-jhonn.iam.gserviceaccount.com
      - name: Install verified Firebase CLI version
        run: npm install --global firebase-tools@15.11.0
      - name: Deploy every function and both Hosting sites
        run: firebase deploy --only functions,hosting --project cv-a-la-medida-jhonn --non-interactive
